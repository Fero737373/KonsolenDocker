name: konsolendocker

services:
  romstore:
    platform: linux/arm64
    build:
      context: .
      dockerfile: romstore/Dockerfile
    image: konsolendocker/romstore:v1
    container_name: konsolendocker-romstore
    restart: "no"
    init: true
    user: "${HOST_UID:?Run ./bin/setup}:${HOST_GID:?Run ./bin/setup}"
    environment:
      GAMES_DIR: /games
      THEGAMESDB_API_KEY_FILE: /run/secrets/thegamesdb_api_key
    secrets:
      - thegamesdb_api_key
    volumes:
      - "${GAMES_DIR:?Run ./bin/setup}:/games:rw"
    networks:
      - console-internal
      - romstore-egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 128
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  pegasus:
    platform: linux/arm64
    build:
      context: .
      args:
        PEGASUS_REF: 6b322063a036db60cba5810fda82a3ce38f1e62f
        PCSX_REARMED_REF: 94f15b3a6b707070aeb0c58cab9bc4eddc1706ff
    image: konsolendocker/pegasus:v1
    container_name: konsolendocker-pegasus
    restart: "no"
    depends_on:
      romstore:
        condition: service_healthy
    networks:
      - console-internal
    init: true
    user: "${HOST_UID:?Run ./bin/setup}:${HOST_GID:?Run ./bin/setup}"
    group_add:
      - "${VIDEO_GID:?Run ./bin/setup}"
      - "${RENDER_GID:?Run ./bin/setup}"
      - "${AUDIO_GID:?Run ./bin/setup}"
      - "${INPUT_GID:?Run ./bin/setup}"
    environment:
      DISPLAY: "${DISPLAY:?Run ./bin/setup}"
      XAUTHORITY: /run/host-xauthority
    volumes:
      - "${GAMES_DIR:?Run ./bin/setup}:/games:rw"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "${XAUTHORITY:?Run ./bin/setup}:/run/host-xauthority:ro"
      - "/dev/input:/dev/input:rw"
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/snd:/dev/snd"
    device_cgroup_rules:
      - "c 13:* rwm"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  console-internal:
    internal: true
  romstore-egress:

secrets:
  thegamesdb_api_key:
    file: ./.runtime/thegamesdb-api-key
